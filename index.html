<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロボット・AI 新着論文アーカイブ</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #3b6fd4;
    --focus: #eef3fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --card: #1c2027; --text: #e8eaed; --muted: #9aa3ad;
      --line: #2c323a; --accent: #7aa2f7; --focus: #1e2734;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 14px 16px 10px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  h1 small { color: var(--muted); font-weight: normal; font-size: 13px; margin-left: 8px; }
  input[type=search] {
    width: 100%; padding: 9px 12px; font-size: 15px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    background: var(--card); color: var(--muted); border: 1px solid var(--line);
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; border-bottom: 1px solid var(--line); }
  .tab {
    font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer; background: none;
    color: var(--muted); border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .tagtoggle {
    font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0;
    padding: 0; margin-top: 10px; cursor: pointer; display: none;
  }
  #tags[hidden] { display: none; }
  @media (max-width: 640px) {
    header { padding: 10px 12px 8px; }
    h1 { font-size: 15px; margin-bottom: 8px; }
    h1 small { display: block; margin: 2px 0 0; font-size: 11px; }
    input[type=search] { padding: 7px 10px; font-size: 14px; }
    .filters { gap: 4px; margin-top: 8px; }
    .chip { font-size: 11px; padding: 2px 8px; }
    .tagtoggle { display: inline-block; }
    main { padding: 4px 12px 40px; }
    .cards { gap: 10px; }
  }
  main { max-width: 980px; margin: 0 auto; padding: 4px 16px 48px; }
  .day { margin-top: 26px; }
  .day > h2 {
    font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px;
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card.focus { border-color: var(--accent); background: var(--focus); }
  .card img { width: 100%; display: block; background: #fff; }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .group { font-size: 11px; font-weight: 700; color: var(--muted); }
  .card.focus .group { color: var(--accent); }
  .title { font-size: 15px; font-weight: 700; margin: 0; }
  .title-en { font-size: 12px; color: var(--muted); margin: 0; }
  .summary { font-size: 13px; margin: 0; }
  .meta { font-size: 11px; color: var(--muted); margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 4px; }
  .tag {
    font: inherit; font-size: 11px; padding: 2px 8px; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--accent); border: 1px solid var(--line);
  }
  .tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .actions { display: flex; gap: 14px; flex-wrap: wrap; }
  a.read { font-size: 12px; color: var(--accent); text-decoration: none; }
  a.read.detail { font-weight: 700; }
  a.read:hover { text-decoration: underline; }
  .note { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🧪 ロボット・AI 新着論文アーカイブ<small id="updated"></small></h1>
    <input type="search" id="q" placeholder="タイトル・要約・著者・arXiv ID で検索" autocomplete="off">
    <div class="tabs" id="tabs">
      <button class="tab" data-view="delivered" aria-selected="true">配信した論文</button>
      <button class="tab" data-view="requests" aria-selected="false">リクエストでまとめた論文</button>
    </div>
    <div class="filters" id="groups"></div>
    <button class="tagtoggle" id="tagtoggle" aria-expanded="false">タグで絞り込む ▾</button>
    <div class="filters" id="tags"></div>
    <p class="count" id="count"></p>
  </div>
</header>

<main id="list"><p class="note">読み込み中…</p></main>

<script>
const GROUPS = { focus: "専門", general: "全般" };
const state = { entries: [], extra: [], tags: new Set(), group: null, q: "", details: new Set(), view: "delivered" };
// スマホではタグ一覧が画面を埋めるので、既定では畳んでおく
const PHONE = window.matchMedia("(max-width: 640px)").matches;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function load() {
  let index;
  try {
    index = await (await fetch("data/index.json", { cache: "no-cache" })).json();
  } catch {
    $("list").innerHTML = '<p class="note">まだ配信データがありません。</p>';
    return;
  }

  const months = index.months || [];
  const files = await Promise.all(months.map(async (m) => {
    try { return (await (await fetch(`data/${m}.json`)).json()).entries || []; }
    catch { return []; }
  }));

  state.entries = files.flat().sort((a, b) =>
    b.date.localeCompare(a.date) || (a.rank ?? 0) - (b.rank ?? 0) || b.id.localeCompare(a.id));

  // 章ごとの日本語まとめがある論文（無い月はカードにリンクを出さないだけ）
  try {
    const details = await (await fetch("details/index.json", { cache: "no-cache" })).json();
    state.details = new Set(details.ids || []);
  } catch { state.details = new Set(); }

  // 配信していないが、リクエストでまとめだけ作った論文は別タブに出す
  const known = new Set(state.entries.map((e) => e.id));
  const extra = await Promise.all([...state.details].filter((id) => !known.has(id)).map(async (id) => {
    try {
      const d = await (await fetch(`details/${id}/paper.json`)).json();
      return {
        id, date: d.generated || "", rank: 0, group: d.group || "manual",
        title: d.title, title_ja: d.title_ja, summary_ja: d.tldr_ja || d.summary_ja || "",
        authors: d.authors || [], categories: d.categories || [], tags: d.tags || [],
        abs_url: d.abs_url, image: d.hero_figure?.image || null,
      };
    } catch { return null; }
  }));
  state.extra = extra.filter(Boolean).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const requestsTab = document.querySelector('.tab[data-view="requests"]');
  requestsTab.textContent = `リクエストでまとめた論文 ${state.extra.length}`;
  requestsTab.hidden = state.extra.length === 0;
  $("updated").textContent = index.updated ? `最終更新 ${index.updated}` : "";
  renderFilters();
  render();
}

function renderFilters() {
  $("groups").innerHTML = Object.entries(GROUPS).map(([key, label]) =>
    `<button class="chip" data-group="${key}" aria-pressed="false">${label}</button>`).join("");

  const counts = new Map();
  for (const e of state.entries)
    for (const t of e.tags || []) counts.set(t, (counts.get(t) || 0) + 1);

  $("tags").innerHTML = [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([tag, n]) =>
      `<button class="chip" data-tag="${esc(tag)}" aria-pressed="false">${esc(tag)} ${n}</button>`)
    .join("");
}

function matches(e) {
  if (state.group && e.group !== state.group) return false;
  for (const t of state.tags) if (!(e.tags || []).includes(t)) return false;
  if (!state.q) return true;

  const hay = [e.title, e.title_ja, e.summary_ja, e.id, (e.authors || []).join(" "),
    (e.tags || []).join(" "), (e.categories || []).join(" ")].join(" ").toLowerCase();
  return state.q.split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

function card(e) {
  const tags = (e.tags || []).map((t) =>
    `<button class="tag" data-tag="${esc(t)}" aria-pressed="${state.tags.has(t)}">${esc(t)}</button>`
  ).join("");

  const detail = state.details.has(e.id) ? `paper.html?id=${encodeURIComponent(e.id)}` : null;
  const link = detail || e.abs_url;

  return `<article class="card ${e.group === "focus" ? "focus" : ""}">
    ${e.image ? `<a href="${esc(link)}"><img src="${esc(e.image)}" alt="" loading="lazy"></a>` : ""}
    <div class="body">
      <div class="group">${GROUPS[e.group] || ""}</div>
      <h3 class="title"><a href="${esc(link)}">${esc(e.title_ja || e.title)}</a></h3>
      <p class="title-en">${esc(e.title)}</p>
      <p class="summary">${esc(e.summary_ja)}</p>
      <p class="meta">${esc((e.authors || []).slice(0, 2).join("、"))}${(e.authors || []).length > 2 ? " ほか" : ""}
        · ${esc((e.categories || [])[0] || "")} · ${esc(e.id)}</p>
      <div class="tags">${tags}</div>
      <div class="actions">
        ${detail ? `<a class="read detail" href="${esc(detail)}">日本語まとめを読む →</a>` : ""}
        <a class="read" href="${esc(e.abs_url)}">arXiv で読む →</a>
      </div>
    </div>
  </article>`;
}

function render() {
  const source = state.view === "requests" ? state.extra : state.entries;
  const hits = source.filter(matches);
  $("count").textContent = `${hits.length} 件 / 全 ${source.length} 件`;

  if (!hits.length) {
    $("list").innerHTML = '<p class="note">該当する論文がありません。</p>';
    return;
  }

  const byDate = new Map();
  for (const e of hits) {
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }

  $("list").innerHTML = [...byDate.entries()].map(([date, items]) =>
    `<section class="day"><h2>${esc(date)}</h2>
      <div class="cards">${items.map(card).join("")}</div></section>`).join("");

  for (const b of document.querySelectorAll("[aria-pressed]"))
    b.setAttribute("aria-pressed",
      b.dataset.tag ? state.tags.has(b.dataset.tag) : state.group === b.dataset.group);
}

document.addEventListener("click", (ev) => {
  const button = ev.target.closest("[data-tag], [data-group]");
  if (!button) return;

  if (button.dataset.tag) {
    const tag = button.dataset.tag;
    state.tags.has(tag) ? state.tags.delete(tag) : state.tags.add(tag);
  } else {
    state.group = state.group === button.dataset.group ? null : button.dataset.group;
  }
  render();
});

$("tabs").addEventListener("click", (ev) => {
  const tab = ev.target.closest(".tab");
  if (!tab) return;
  state.view = tab.dataset.view;
  for (const t of document.querySelectorAll(".tab"))
    t.setAttribute("aria-selected", t === tab);
  render();
});

const tagToggle = $("tagtoggle");
function setTagsOpen(open) {
  $("tags").hidden = !open;
  tagToggle.setAttribute("aria-expanded", open);
  tagToggle.textContent = open ? "タグを閉じる ▴" : `タグで絞り込む${state.tags.size ? `（${state.tags.size}）` : ""} ▾`;
}
tagToggle.addEventListener("click", () => setTagsOpen($("tags").hidden));
setTagsOpen(!PHONE);

$("q").addEventListener("input", (ev) => {
  state.q = ev.target.value.trim().toLowerCase();
  render();
});

load();
</script>
</body>
</html>
