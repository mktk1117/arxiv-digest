<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>arXiv Digest · Takahiro Miki</title>
<meta name="description" content="A daily pick of new robotics and AI papers from arXiv, with plain-language summaries in English and Japanese.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&family=Geist+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;600;800&display=swap">
<link rel="stylesheet" href="digest.css">
<script>try{if(localStorage.getItem("tm2-mode")==="dark")document.documentElement.setAttribute("data-mode","dark")}catch(e){}</script>
<style>
  main { padding: 120px var(--side) 0; }
  .head h1 { margin: 0; font: 800 clamp(44px, 7vw, 104px)/.92 var(--display); letter-spacing: -.05em; text-wrap: balance; }
  :lang(ja) .head h1 { font-size: clamp(36px, 5.6vw, 80px); line-height: 1.05; }
  .head p { margin: 18px 0 0; color: var(--ink-2); max-width: 60ch; font-size: 18px; }
  .head .updated { margin-top: 18px; color: var(--mute); }
  .tools {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 40px;
    padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .tools .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .search {
    margin-left: auto; flex: 1 1 240px; max-width: 360px; background: var(--ground-2); border: 1px solid var(--line);
    color: var(--ink); border-radius: 6px; padding: 10px 12px; font: 400 15px/1.2 var(--body);
  }
  .search::placeholder { color: var(--mute); }
  .tagrow { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 0 0; }
  .count { color: var(--mute); margin: 16px 0 0; }

  .day { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; padding-top: 44px; }
  .day > header { position: sticky; top: 84px; align-self: start; }
  .day .md { font: 800 38px/1 var(--display); letter-spacing: -.05em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .day .yw { margin-top: 8px; color: var(--mute); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 36px 24px; }
  .card { display: flex; flex-direction: column; min-width: 0; }
  .thumb { display: block; aspect-ratio: 16/10; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 5%; display: block; transition: transform .5s ease; }
  .card:hover .thumb img { transform: scale(1.03); }
  .thumb.type { background: var(--ground-2); display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; text-decoration: none; }
  .thumb.type .big { font: 800 40px/.9 var(--display); letter-spacing: -.05em; color: var(--ink-2); }
  .thumb.type .mono { margin-top: 8px; color: var(--mute); }
  .card .meta { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--mute); font-size: 11px; }
  .card .meta .grp { color: var(--tag); }
  .card h3 { margin: 6px 0 0; font: 600 18px/1.3 var(--body); text-wrap: pretty; }
  :lang(ja) .card h3 { font-size: 17px; line-height: 1.45; }
  .card h3 a { text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .card .sub { margin: 4px 0 0; color: var(--mute); font-size: 13px; line-height: 1.4; }
  .card .summary { margin: 10px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.6; }
  .card .auth { margin: 10px 0 0; color: var(--mute); font-size: 13px; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .card .plinks { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: auto; padding-top: 14px; }
  .card .plinks a { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; text-underline-offset: 4px; color: var(--ink-2); }
  .card .plinks a.primary { color: var(--tag); }
  .card .plinks a:hover { color: var(--ink); }
  @media (max-width: 760px) {
    main { padding-top: 96px; }
    .day { grid-template-columns: 1fr; gap: 14px; }
    .day > header { position: static; display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .day .md { font-size: 28px; }
    .day .yw { margin: 0; }
    .search { margin-left: 0; max-width: none; }
    .tools .sep { display: none; }
  }
</style>
</head>
<body>
<main>
  <header class="head">
    <div class="eyebrow mono" data-ja="毎日の arXiv ダイジェスト" data-en="Daily arXiv digest">Daily arXiv digest</div>
    <h1 data-ja="ロボット・AI 新着論文" data-en="Robotics papers, every day">Robotics papers, every day</h1>
    <p data-ja="毎日 arXiv の新着からロボティクスと AI の論文をいくつか選び、何をした論文なのかを短くまとめています。カードを開くと、章ごとの詳しいまとめと論文の図が読めます。"
       data-en="Each day a bot reads the new robotics and AI papers on arXiv, picks a handful, and writes a short plain-language summary. Open a card for a chapter-by-chapter walkthrough with the paper's figures."></p>
    <div class="updated mono" id="updated"></div>
  </header>

  <div class="tools">
    <div id="tabs" style="display:contents">
      <button class="chip" data-view="delivered" aria-pressed="true"></button>
      <button class="chip" data-view="requests" aria-pressed="false" hidden></button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div id="groups" style="display:contents"></div>
    <button class="chip" id="tagtoggle" aria-expanded="false"></button>
    <input type="search" class="search" id="q" autocomplete="off"
      data-ja-placeholder="タイトル・要約・著者・arXiv ID で検索" data-en-placeholder="Search title, summary, author, arXiv ID">
  </div>
  <div class="tagrow" id="tags" hidden></div>
  <p class="count mono" id="count"></p>

  <div id="list"><p class="note" data-ja="読み込み中…" data-en="Loading…"></p></div>
</main>

<script src="digest.js"></script>
<script>
const { esc } = Digest;
const T = (ja, en) => Digest.t({ ja, en });
const GROUPS = { focus: { ja: "専門", en: "Focus" }, general: { ja: "全般", en: "General" } };
const state = { entries: [], extra: [], tags: new Set(), group: null, q: "", details: new Set(), view: "delivered", loaded: false };
// スマホではタグ一覧が画面を埋めるので、既定では畳んでおく
const PHONE = window.matchMedia("(max-width: 640px)").matches;
let tagsOpen = !PHONE;
const $ = (id) => document.getElementById(id);

async function load() {
  let index;
  try {
    index = await (await fetch("data/index.json", { cache: "no-cache" })).json();
  } catch {
    $("list").innerHTML = `<p class="note">${T("まだ配信データがありません。", "Nothing here yet.")}</p>`;
    return;
  }

  const months = index.months || [];
  const files = await Promise.all(months.map(async (m) => {
    try { return (await (await fetch(`data/${m}.json`)).json()).entries || []; }
    catch { return []; }
  }));

  state.entries = files.flat().sort((a, b) =>
    b.date.localeCompare(a.date) || (a.rank ?? 0) - (b.rank ?? 0) || b.id.localeCompare(a.id));

  // 章ごとのまとめがある論文（無い論文はカードから arXiv へ直接リンクする）
  try {
    const details = await (await fetch("details/index.json", { cache: "no-cache" })).json();
    state.details = new Set(details.ids || []);
  } catch { state.details = new Set(); }

  // 配信していないが、リクエストでまとめだけ作った論文は別タブに出す
  const known = new Set(state.entries.map((e) => e.id));
  const extra = await Promise.all([...state.details].filter((id) => !known.has(id)).map(async (id) => {
    try {
      const d = await (await fetch(`details/${id}/paper.json`)).json();
      let en = null;
      try { const r = await fetch(`details/${id}/paper.en.json`); if (r.ok) en = await r.json(); } catch {}
      return {
        id, date: d.generated || "", rank: 0, group: d.group || "manual",
        title: d.title, title_ja: d.title_ja, summary_ja: d.tldr_ja || d.summary_ja || "",
        summary_en: en?.tldr || "",
        authors: d.authors || [], categories: d.categories || [], tags: d.tags || [],
        abs_url: d.abs_url, image: d.hero_figure?.image || null,
      };
    } catch { return null; }
  }));
  state.extra = extra.filter(Boolean).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  state.updated = index.updated || "";
  state.loaded = true;
  renderFilters();
  render();
}

function renderChrome() {
  const delivered = document.querySelector('[data-view="delivered"]');
  const requests = document.querySelector('[data-view="requests"]');
  delivered.textContent = `${T("配信した論文", "Daily picks")} · ${state.entries.length}`;
  requests.textContent = `${T("リクエスト", "On request")} · ${state.extra.length}`;
  requests.hidden = state.extra.length === 0;
  $("updated").textContent = state.updated ? `${T("最終更新", "Updated")} ${state.updated}` : "";
  const t = $("tagtoggle");
  t.textContent = tagsOpen ? T("タグを閉じる ▴", "Hide tags ▴")
    : `${T("タグで絞り込む", "Filter by tag")}${state.tags.size ? ` (${state.tags.size})` : ""} ▾`;
  t.setAttribute("aria-expanded", String(tagsOpen));
  // リクエスト分は専門/全般の枠もタグも無いので、絞り込みは検索だけにする
  const requestsView = state.view === "requests";
  $("groups").hidden = requestsView;
  for (const el of $("groups").children) el.hidden = requestsView;
  t.hidden = requestsView;
  $("tags").hidden = requestsView || !tagsOpen;
}

function renderFilters() {
  $("groups").innerHTML = Object.entries(GROUPS).map(([key, label]) =>
    `<button class="chip" data-group="${key}" aria-pressed="${state.group === key}">${Digest.t(label)}</button>`).join("");

  const counts = new Map();
  for (const e of state.entries)
    for (const t of e.tags || []) counts.set(t, (counts.get(t) || 0) + 1);

  $("tags").innerHTML = [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([tag, n]) =>
      `<button class="chip small" data-tag="${esc(tag)}" aria-pressed="${state.tags.has(tag)}">${esc(tag)} ${n}</button>`)
    .join("");
}

function matches(e) {
  if (state.group && e.group !== state.group) return false;
  for (const t of state.tags) if (!(e.tags || []).includes(t)) return false;
  if (!state.q) return true;

  const hay = [e.title, e.title_ja, e.summary_ja, e.summary_en, e.id, (e.authors || []).join(" "),
    (e.tags || []).join(" "), (e.categories || []).join(" ")].join(" ").toLowerCase();
  return state.q.split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

function card(e) {
  const en = Digest.lang === "en";
  const tags = (e.tags || []).map((t) =>
    `<button class="chip small" data-tag="${esc(t)}" aria-pressed="${state.tags.has(t)}">${esc(t)}</button>`
  ).join("");

  const detail = state.details.has(e.id) ? Digest.href(`paper.html?id=${encodeURIComponent(e.id)}`) : null;
  const link = detail || e.abs_url;
  const title = en ? e.title : (e.title_ja || e.title);
  const sub = en ? "" : (e.title_ja ? e.title : "");
  // 英語の要約が無い古いカード（バックフィル前）は、要約を出さずタイトルだけにする
  const summary = en ? (e.summary_en || "") : e.summary_ja;
  const authors = e.authors || [];
  const who = authors.slice(0, 3).join(", ") + (authors.length > 3 ? (en ? " et al." : " ほか") : "");
  const group = GROUPS[e.group] ? Digest.t(GROUPS[e.group]) : "";

  const thumb = e.image
    ? `<a class="thumb figbox" href="${esc(link)}" tabindex="-1"><img src="${esc(e.image)}" alt="" loading="lazy"></a>`
    : `<a class="thumb figbox type" href="${esc(link)}" tabindex="-1"><span class="big">${esc((e.categories || [])[0] || "arXiv")}</span><span class="mono">${esc(e.id)}</span></a>`;

  return `<article class="card">
    ${thumb}
    <div class="meta mono">${group ? `<span class="grp">${esc(group)}</span>` : ""}<span>${esc((e.categories || [])[0] || "")}</span><span>${esc(e.id)}</span></div>
    <h3><a href="${esc(link)}">${esc(title)}</a></h3>
    ${sub ? `<p class="sub">${esc(sub)}</p>` : ""}
    ${summary ? `<p class="summary">${esc(summary)}</p>` : ""}
    <p class="auth">${esc(who)}</p>
    <div class="tags">${tags}</div>
    <div class="plinks">
      ${detail ? `<a class="primary" href="${esc(detail)}">${T("まとめを読む →", "Read the summary →")}</a>` : ""}
      <a href="${esc(e.abs_url)}">arXiv</a>
    </div>
  </article>`;
}

function dayHeader(date) {
  const d = new Date(`${date}T00:00:00`);
  if (Number.isNaN(d.getTime())) return `<header><div class="md">${esc(date)}</div></header>`;
  const wd = d.toLocaleDateString(Digest.lang === "en" ? "en-US" : "ja-JP", { weekday: "short" });
  return `<header><div class="md">${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}</div>
    <div class="yw mono">${d.getFullYear()} · ${esc(wd)}</div></header>`;
}

function render() {
  renderChrome();
  if (!state.loaded) return;
  const source = state.view === "requests" ? state.extra : state.entries;
  const hits = source.filter(matches);
  $("count").textContent = Digest.lang === "en"
    ? `${hits.length} of ${source.length} papers` : `${hits.length} 件 / 全 ${source.length} 件`;

  if (!hits.length) {
    $("list").innerHTML = `<p class="note">${T("該当する論文がありません。", "No papers match.")}</p>`;
    return;
  }

  const byDate = new Map();
  for (const e of hits) {
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }

  $("list").innerHTML = [...byDate.entries()].map(([date, items]) =>
    `<section class="day">${dayHeader(date)}<div class="cards">${items.map(card).join("")}</div></section>`).join("");

  for (const b of document.querySelectorAll("[data-tag], [data-group]"))
    b.setAttribute("aria-pressed",
      b.dataset.tag ? state.tags.has(b.dataset.tag) : state.group === b.dataset.group);
}

document.addEventListener("click", (ev) => {
  const button = ev.target.closest("button[data-tag], button[data-group]");
  if (button) {
    if (button.dataset.tag) {
      const tag = button.dataset.tag;
      state.tags.has(tag) ? state.tags.delete(tag) : state.tags.add(tag);
    } else {
      state.group = state.group === button.dataset.group ? null : button.dataset.group;
    }
    render();
    return;
  }
  const tab = ev.target.closest("button[data-view]");
  if (tab) {
    state.view = tab.dataset.view;
    for (const t of document.querySelectorAll("[data-view]"))
      t.setAttribute("aria-pressed", String(t === tab));
    render();
  }
});

$("tagtoggle").addEventListener("click", () => { tagsOpen = !tagsOpen; renderChrome(); });

$("q").addEventListener("input", (ev) => {
  state.q = ev.target.value.trim().toLowerCase();
  render();
});

Digest.onLang(() => { renderFilters(); render(); });
renderChrome();
load();
</script>
</body>
</html>
